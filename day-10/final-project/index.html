<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Hygiene Risk Predictor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin-top: 25px;
            padding: 18px;
            border-radius: 10px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            display: none;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <h1>Smart Hygiene Risk Predictor</h1>
        <p class="subtitle">
            Predict the hygiene risk level of a facility using Machine Learning.
        </p>

        <div class="form-grid">

           <div>
    <label>Location</label>
    <select id="location">
        <option value="Civil Lines">Civil Lines</option>
        <option value="Dharampeth">Dharampeth</option>
        <option value="Hingna">Hingna</option>
        <option value="Kamptee Road">Kamptee Road</option>
        <option value="Manish Nagar">Manish Nagar</option>
        <option value="Mihan">Mihan</option>
        <option value="Nagpur Central">Nagpur Central</option>
        <option value="Sadar">Sadar</option>
        <option value="Sitabuldi">Sitabuldi</option>
        <option value="Wardha Road">Wardha Road</option>
    </select>
</div>

            <div>
    <label>Facility Type</label>
    <select id="facility_type">
        <option value="Hospital Washroom">Hospital Washroom</option>
        <option value="Mall Washroom">Mall Washroom</option>
        <option value="Office Washroom">Office Washroom</option>
        <option value="Public Washroom">Public Washroom</option>
        <option value="School Washroom">School Washroom</option>
        <option value="Transit Washroom">Transit Washroom</option>
    </select>
</div>

            <div>
                <label>Cleanliness Score</label>
                <input id="cleanliness_score" type="number" step="0.1">
            </div>

            <div>
                <label>Odor Score</label>
                <input id="odor_score" type="number" step="0.1">
            </div>

            <div>
                <label>Waste Level</label>
                <input id="waste_level" type="number" step="0.1">
            </div>

            <div>
                <label>Water Availability</label>
                <select id="water_availability">
                    <option value="Available">Available</option>
                    <option value="Not Available">Not Available</option>
                </select>
            </div>

            <div>
                <label>Footfall</label>
                <input id="footfall" type="number">
            </div>

            <div>
                <label>Complaints</label>
                <input id="complaints" type="number">
            </div>

            <div>
                <label>Hours Since Cleaning</label>
                <input id="hours_since_cleaning" type="number" step="0.1">
            </div>

        </div>

        <button onclick="predictRisk()">Predict Hygiene Risk</button>

        <div id="result"></div>

    </div>
</div>

<script>
async function predictRisk() {

    const result = document.getElementById("result");

    const data = {
        location: document.getElementById("location").value,
        facility_type: document.getElementById("facility_type").value,
        cleanliness_score: Number(document.getElementById("cleanliness_score").value),
        odor_score: Number(document.getElementById("odor_score").value),
        waste_level: Number(document.getElementById("waste_level").value),
        water_availability: document.getElementById("water_availability").value,
        footfall: Number(document.getElementById("footfall").value),
        complaints: Number(document.getElementById("complaints").value),
        hours_since_cleaning: Number(document.getElementById("hours_since_cleaning").value)
    };

    result.style.display = "block";
    result.textContent = "Predicting...";

    try {
        const response = await fetch("/api", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const output = await response.json();

        if (output.success) {
            result.textContent = "Hygiene Risk: " + output.hygiene_risk;
        } else {
            result.textContent = "Error: " + output.error;
        }

    } catch (error) {
        result.textContent = "Unable to connect to prediction API.";
    }
}
</script>

</body>
</html>
